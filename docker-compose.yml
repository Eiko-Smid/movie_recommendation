version: "3.9"

services:
  mlflow:
    image: ${DOCKER_USERNAME}/movie-reco-mlflow:latest
    restart: "no"
    ports:
      - "5000:5000"
    # Single canonical volume where BOTH the DB and artifacts live on your host
    volumes:
      - ./mlflow:/mlflow


# PostgreSQL Database
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}         # the DB that will get initialized
      PGDATA: /var/lib/postgresql/data    # default; can be omitted
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT 1 FROM app_meta WHERE key='seed_done' AND value='true';\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 30s
    volumes:
      # Persist database files
      - pgdata:/var/lib/postgresql/data

      # Auto-init scripts (run only on first boot of a fresh volume)
      - ./src/db/table_definitions:/docker-entrypoint-initdb.d:ro

      # Mount CSVs into a known path the init scripts can access
      - ./data/ml-20m:/seed:ro


  api:
    image: ${DOCKER_USERNAME}/movie-reco-api:latest
    depends_on: 
      postgres:
            # Waits with start until db is set up
          condition: service_healthy
      mlflow:
        condition: service_started
    ports:
      - "8000:8000"   # FastAPI
      - "5678:5678"   # debugpy
    restart: "no"
    environment:
      # If you run MLflow on Windows host at :5000, use host.docker.internal
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_EXPERIMENT_NAME: "als_movie_rec"
      MODEL_NAME: "als_model_versioning"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      # Mount your data exactly where code expects it
      - ./data:/app/data:ro
      # Optional: live-edit code without rebuilds
      - ./src:/app/src
      # Champion csr matrix storage
      - ./champ_store:/app/champ_store
      # Environment var for db.
      - ./.env:/app/.env


# Add Prometheus
  prometheus:
    image: prom/prometheus:v3.10.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_storage:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api


# Add Grafana
  grafana:
    image: grafana/grafana:12.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/provisioning/dashboards:/var/lib/grafana/dashboards
      - grafana_storage:/var/lib/grafana
      

  # Add streamlit
  streamlit:
    image: ${DOCKER_USERNAME}/movie-reco-streamlit:latest
    depends_on:
      - api      
    ports:
      - "8501:8501"
    environment:
      DB_URL: ${DB_URL}
      API_URL: "http://api:8000" 
    networks:
      - default 
    volumes:
      - ./streamlit:/app     # mount local streamlit folder inside container at /app
      - ./streamlit_cache:/root/.streamlit/cache # mount local cache folder inside container at /root/.streamlit/cache


  # Scheduled Trainer (daily retraining)
  trainer:
    image: ${DOCKER_USERNAME}/movie-reco-trainer:latest
    user: root
    depends_on:
      api:
        condition: service_started
    environment:
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
    volumes:
      - ./logs:/var/log
      - ./trainer_utils:/app/trainer_utils
      # - ./trainer_utils/train_payload.json:/data/train_payload.json:ro


# Define storage locations handled by docker
volumes:
  # Tell docker to create a storage location named pgdata on host system 
  # Storage is automatically created by docker
  pgdata:
  prometheus_storage:
  grafana_storage:
